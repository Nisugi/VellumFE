# VellumFE Controller Configuration
# GUI gamepad bindings, radial wheels, rumble, and input-feel tuning.
# Edit with the .controller editor (GUI) or directly in this file.
# Controller binds are global (shared across all characters).
#
# This file was split out of keybinds.toml so a controller config can be
# shared or version-controlled as one unit, and a malformed edit here
# cannot take keyboard input down with it.

# ═══════════════════════════════════════════════════════════════════════════
# CONTROLLER (GUI gamepad — edit with the .controller editor)
# ═══════════════════════════════════════════════════════════════════════════
# Buttons: south, east, west, north, dpad_up, dpad_down, dpad_left,
# dpad_right, l1, r1, l2, r2, l3, r3, start, select.
# Values are keybind action names or { macro_text = "..." } like [user].
# While interact mode or a context menu is open, the d-pad navigates,
# south confirms/activates, and east cancels BY DEFAULT. These are now
# configurable: bind a button to menu_up / menu_down / menu_left /
# menu_right (menu navigation), interact_select (activate the interact
# focus / confirm a menu), or menu_cancel (close a menu) to move those
# roles onto other buttons. Assigning one frees the physical default.
# East always cancels a menu, and the interact_mode button always exits
# interact mode, as guaranteed escape hatches. Bindings apply outside
# those modes. Controller binds are global (all characters).

# The left stick walks the 8 compass directions natively; the d-pad
# covers the vertical axis and portals.
[controller]
start = "interact_mode"                # Enter/exit interact mode
dpad_up = { macro_text = "up\r" }      # Climb / go up
dpad_down = { macro_text = "down\r" }  # Go down
dpad_right = { macro_text = "out\r" }  # Leave (buildings, rooms)
dpad_left = { macro_text = ".portal\r" } # Walk the room's door/arch/gate
south = { macro_text = "look\r" }      # A / cross
l2 = "controller_modifier"             # Hold: chords other buttons (e.g. l2+south)
r2 = "controller_wheel"                # Hold: radial command wheel (aim stick picks)
# On r3, not l3: clicking l3 nudges the LEFT stick - the movement stick -
# past the walk threshold before the hold registers, causing stray
# compass moves. The right stick's click only jostles the aim, which
# settles harmlessly as the wheel opens.
r3 = "controller_wheel:portals"        # Hold: the room's noun exits (go gate, ...)
select = "controller_overlay"          # Toggle the binding-legend overlay

# Modifier chords: hold a button declared `controller_modifier` (l2 above)
# and press another button to fire its modified binding. The key is the
# canonical `<modifiers>+<button>` combo; up to two modifiers may be
# combined (e.g. "l1+r1+south"). Resolution is exact-match on the held set,
# so l2+south below fires only while l2 is held.
"l2+dpad_up" = "scroll_current_window_up_page"
"l2+dpad_down" = "scroll_current_window_down_page"
"l2+south" = { macro_text = "stand\r" }

# Which bindings the overlay legend shows (curate it - you don't need all
# of them). Each entry is a bind key: bare ("south") or a modifier combo
# ("l2+south"). Toggle with the HUD checkboxes in the .controller editor.
[controller_overlay]
buttons = ["start", "dpad_left", "l2", "r2", "l2+south"]

# Rumble on game events. Patterns: off, short, long, double.
# Edit in the .controller editor's Rumble tab.
[controller_rumble]
enabled = true
roundtime_end = "short"   # hands free again
stunned = "long"
death = "double"

# Controller input feel. Every field is optional — an absent table or
# field uses the value shown here. Edit in the .controller editor's
# Tuning tab. Dwell gates when a wheel slice commits: rest on your target,
# then release to fire; return the stick to center before releasing to
# cancel. Folders auto-descend on dwell, and each folder reserves a Back
# slice (dwell it to go up a level).
[controller_tuning]
movement_stick = "left"    # "left" | "right" — which stick walks
back_slice = "down"        # up|down|left|right|up-left|up-right|down-left|down-right
deadzone = 50              # % stick deflection before a wheel slice registers
aim_dwell_ms = 150         # hold a leaf this long before it arms to fire
nav_dwell_ms = 150         # hold a folder / Back slice this long before it navigates
fire_debounce_ms = 300     # suppress repeat fires
release_grace_ms = 40      # hush movement briefly after release so firing doesn't walk
fire_mode = "release"      # "release" | "edge" | "retract" — how a committed leaf fires
edge_threshold = 90        # % deflection that fires in "edge" mode (no dwell)
retract_delta = 10         # % inward from peak that fires in "retract" mode

# Radial command wheel (hold r2, aim with the wheel/aim stick, dwell to
# commit, release to fire). Folders auto-open on dwell and reserve a Back
# slice. Feel is tuned in [controller_tuning]; edit slices in the
# .controller editor's Wheel tab.
#
# Per-wheel button/stick live in [controller_wheels_meta.<name>] (set them
# in the Wheels tab). `button` is written alongside the matching
# [controller] entry, which stays the binding authority; `stick`
# ("left"/"right") overrides movement_stick while that wheel is open. The
# default wheel uses the name "default". Example (edited via the GUI):
#   [controller_wheels_meta.default]
#   button = "r2"
#   stick  = "left"
[[controller_wheel]]
label = "look"
command = "look"

[[controller_wheel]]
label = "search"
command = "search"

[[controller_wheel]]
label = "stand"
command = "stand"

[[controller_wheel]]
label = "hide"
command = "hide"

[[controller_wheel]]
label = "exp"
command = "exp"

[[controller_wheel]]
label = "health"
command = "health"

[[controller_wheel]]
label = "glance"
command = "glance"

[[controller_wheel]]
label = "portal"
command = ".portal"

# A folder slice: aim it and press South (A) to open its child ring;
# East (B) backs up a level. Folders can nest (keep it shallow).
[[controller_wheel]]
label = "stance"

  # Optional color = wedge tint (hex or palette name): dim at rest,
  # bright while aimed — color-code wheels by function.
  [[controller_wheel.slices]]
  label = "defensive"
  command = "stance defensive"
  color = "#2e8b57"

  [[controller_wheel.slices]]
  label = "neutral"
  command = "stance neutral"
  color = "#4682b4"

  [[controller_wheel.slices]]
  label = "forward"
  command = "stance forward"
  color = "#cc8844"

  [[controller_wheel.slices]]
  label = "offensive"
  command = "stance offensive"
  color = "#b03030"