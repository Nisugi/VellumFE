# Built-in window catalog — the definitions behind every window the user can
# add from a menu, plus the bases discovery borrows from.
#
# GENERATED, then maintained by hand. Produced by serializing the former
# 77-arm match in config/presets.rs so the extraction could be proven
# faithful against tests/fixtures/template_characterization.txt.
#
# Each entry is a WindowDef exactly as layout.toml stores one, so the format
# is already familiar and already round-trips.
#
# Order and per-game gating are NOT here: they live in the CATALOG table in
# config/presets.rs, which stays the single ordered list of built-in keys.
# This file answers only "what IS a compass", never "which windows exist".
#
# Editing: the golden fixture pins every template. Change something here and
# tests/template_characterization.rs tells you precisely what moved.

