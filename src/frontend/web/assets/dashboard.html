<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111318">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icon.svg">
  <title>VellumFE — Sessions</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      height: 100%;
      background: #111318;
      color: #d6d6d6;
      font-family: ui-monospace, Menlo, Consolas, monospace;
      -webkit-text-size-adjust: 100%;
    }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: env(safe-area-inset-top) 16px env(safe-area-inset-bottom);
    }
    h1 {
      margin: 28px 0 4px;
      font-size: 20px;
      color: #d9b44f;
    }
    p.sub {
      color: #8a8f98;
      font-size: 12px;
      margin-bottom: 22px;
    }
    #sessions {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    a.session {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px;
      background: #1a1d24;
      border: 1px solid #2a2e37;
      border-radius: 10px;
      color: #d6d6d6;
      text-decoration: none;
      font-size: 16px;
    }
    a.session:active { background: #2a2e37; }
    a.session .port { color: #8a8f98; font-size: 12px; }
    .empty {
      color: #8a8f98;
      font-style: italic;
      text-align: center;
      padding: 24px 0;
    }
    a.wall {
      display: block;
      margin-top: 18px;
      text-align: center;
      color: #8a8f98;
      font-size: 13px;
      text-decoration: none;
    }
    a.wall:hover { color: #d6d6d6; }
    #pair {
      width: 100%;
      max-width: 420px;
      display: none;
      flex-direction: column;
      gap: 10px;
      padding: 16px;
      background: #1a1d24;
      border: 1px solid #2a2e37;
      border-radius: 10px;
    }
    #pair.visible { display: flex; }
    #pair p { font-size: 13px; color: #8a8f98; }
    #pair p.reject { color: #d9534f; }
    #pair input {
      padding: 12px;
      background: #111318;
      color: #d6d6d6;
      border: 1px solid #2a2e37;
      border-radius: 8px;
      font: inherit;
      font-size: 16px;
    }
    #pair button, #retry-net {
      padding: 12px;
      background: #2a2e37;
      color: #d9b44f;
      border: none;
      border-radius: 8px;
      font: inherit;
      font-size: 15px;
      cursor: pointer;
    }
    #retry-net { display: none; width: 100%; max-width: 420px; margin-top: 10px; }
    #retry-net.visible { display: block; }
    a.picker-link {
      display: none;
      text-align: center;
      color: #8a8f98;
      font-size: 13px;
      text-decoration: none;
      padding: 6px 0;
    }
    a.picker-link.visible { display: block; }
  </style>
</head>
<body>
  <h1>VellumFE</h1>
  <p class="sub">Pick a session — this page never connects to a game.</p>
  <div id="sessions"><div class="empty">Looking for sessions&hellip;</div></div>
  <form id="pair">
    <p id="pair-msg">This server requires a pairing token. Enter the token
    shown by the desktop client's <b>.webinfo</b> command.</p>
    <input id="pair-token" type="password" autocomplete="off"
           autocapitalize="off" spellcheck="false" placeholder="Pairing token">
    <button type="submit">Connect</button>
  </form>
  <button id="retry-net" type="button">Retry</button>
  <a id="picker-link" class="picker-link" href="vellum://remote/picker">&larr; Back to character picker</a>
  <a id="wall-link" class="wall" href="/characters">All characters at a glance &rarr;</a>
  <script src="/pairing-core.js"></script>
  <script>
    // Session listing + in-page pairing (proposal item 9). All the
    // classification/fragment rules live in PairingCore (pairing-core.js,
    // node-tested); this script is DOM glue only.
    //
    // Token ownership (see pairing-core.js header): a native shell sends
    // sid=<stable store ID>; a token accepted here rides
    // vellum://remote/token?id=…&token=… back to the shell, which updates
    // exactly that saved entry. Plain browsers persist the token in
    // localStorage instead. Navigation always carries it via the URL
    // fragment — never ordinary query strings.
    const TOKEN_KEY = "vellum-dashboard-token";
    let token = PairingCore.pairingToken(location.hash);
    if (!token) {
      try { token = localStorage.getItem(TOKEN_KEY) || ""; } catch {}
    }
    // Whether the pairing form is up; the periodic refresh stands down so
    // it can't clobber a token mid-typing.
    let pairingOpen = false;

    // The registry can hold stale entries (crashes, other machines'
    // leftovers); only sessions that answer /health get a card.
    async function alive(port) {
      try {
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), 1500);
        const res = await fetch(`http://${location.hostname}:${port}/health`, {
          signal: controller.signal,
        });
        clearTimeout(timer);
        return res.ok;
      } catch {
        return false;
      }
    }

    function setEmpty(box, text) {
      box.replaceChildren();
      const empty = document.createElement("div");
      empty.className = "empty";
      empty.textContent = text;
      box.appendChild(empty);
    }

    function showPairing(rejected) {
      pairingOpen = true;
      const msg = document.getElementById("pair-msg");
      if (rejected) {
        msg.textContent = "That pairing token was not accepted. Check the " +
          "token shown by the desktop client's .webinfo command and try again.";
        msg.className = "reject";
      }
      document.getElementById("pair").classList.add("visible");
      // Native shells get a way back to their character picker without
      // deleting the saved server; a plain browser has no picker.
      if (PairingCore.isAppShell(location.hash)) {
        document.getElementById("picker-link").classList.add("visible");
      }
      document.getElementById("pair-token").focus();
    }

    function hidePairing() {
      pairingOpen = false;
      document.getElementById("pair").classList.remove("visible");
      document.getElementById("picker-link").classList.remove("visible");
    }

    // An accepted token: persist for reuse and thread it through every
    // navigation via the existing fragment mechanism.
    function adoptToken(accepted) {
      if (!accepted) return;
      const fromFragment = PairingCore.pairingToken(location.hash);
      if (fromFragment !== accepted) {
        // The shell/QR didn't supply this token — it was entered (or
        // recalled) here. Thread it into the fragment, and hand it back
        // to the native shell's saved entry (by stable ID) so the next
        // connect from the picker is already paired. The vellum://
        // navigation is intercepted by the shell; the page stays put.
        const hash = PairingCore.withToken(location.hash, accepted);
        history.replaceState(null, "", location.pathname + location.search + hash);
        const sid = PairingCore.shellSid(location.hash);
        const update = PairingCore.tokenUpdateUrl(sid, accepted);
        if (update && PairingCore.isAppShell(location.hash)) {
          location.href = update;
        }
      }
      try { localStorage.setItem(TOKEN_KEY, accepted); } catch {}
    }

    async function load(attempted) {
      const box = document.getElementById("sessions");
      const retry = document.getElementById("retry-net");
      const { state, sessions } =
        await PairingCore.loadSessions((u) => fetch(u), token);
      retry.classList.remove("visible");
      if (state === "forbidden") {
        setEmpty(box, token ? "Access denied" : "Pairing required");
        showPairing(attempted || !!token);
        return;
      }
      if (state === "network") {
        setEmpty(box, "Can't reach the server");
        retry.classList.add("visible");
        return;
      }
      // Authenticated ("empty" or "sessions"): pairing is done.
      hidePairing();
      adoptToken(token);
      // Forward the (token-bearing) fragment so the wall can auth its
      // watch sockets.
      document.getElementById("wall-link").href = "/characters" + location.hash;
      const checks = await Promise.all(sessions.map(s => alive(s.port)));
      const live = sessions.filter((_, i) => checks[i]);
      box.replaceChildren();
      if (!live.length) {
        setEmpty(box, "No sessions running");
        return;
      }
      for (const s of live) {
        const a = document.createElement("a");
        a.className = "session";
        // Forward the pairing token fragment so the session page can
        // store it (fragment-based navigation, never query strings).
        a.href = `http://${location.hostname}:${s.port}/play${location.hash}`;
        const name = document.createElement("span");
        name.textContent = s.character || "(unnamed)";
        const port = document.createElement("span");
        port.className = "port";
        port.textContent = `:${s.port}`;
        a.append(name, port);
        box.appendChild(a);
      }
    }

    document.getElementById("pair").addEventListener("submit", (e) => {
      e.preventDefault();
      const entered = document.getElementById("pair-token").value.trim();
      if (!entered) return;
      token = entered;
      load(true);
    });
    document.getElementById("retry-net").addEventListener("click", () => load());

    document.getElementById("wall-link").href = "/characters" + location.hash;
    load();
    // Keep refreshing, but never while the pairing form is up.
    setInterval(() => { if (!pairingOpen) load(); }, 10000);
  </script>
</body>
</html>
