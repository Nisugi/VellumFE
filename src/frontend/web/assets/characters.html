<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111318">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <title>VellumFE — Characters</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      min-height: 100%;
      background: #111318;
      color: #d6d6d6;
      font-family: ui-monospace, Menlo, Consolas, monospace;
      -webkit-text-size-adjust: 100%;
    }
    body { padding: env(safe-area-inset-top) 12px env(safe-area-inset-bottom); }
    header {
      display: flex; align-items: baseline; gap: 10px;
      padding: 14px 4px 12px;
    }
    header h1 { font-size: 18px; color: #d9b44f; }
    header a { color: #8a8f98; font-size: 12px; text-decoration: none; }
    header a:hover { color: #d6d6d6; }
    #gear {
      margin-left: auto; background: none; border: 1px solid #2a2e37;
      border-radius: 6px; color: #8a8f98; font: inherit; font-size: 13px;
      padding: 3px 9px; cursor: pointer;
    }
    #gear:hover, #gear.open { color: #d6d6d6; border-color: #3a3f4a; }

    /* Display config panel */
    #config {
      display: none;
      background: #1a1d24; border: 1px solid #2a2e37; border-radius: 10px;
      padding: 12px 14px; margin: 0 0 12px; font-size: 12.5px;
      max-width: 560px;
    }
    #config.open { display: block; }
    #config h2 { font-size: 12px; color: #8a8f98; margin: 8px 0 6px; font-weight: normal; }
    #config h2:first-child { margin-top: 0; }
    #config .grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 3px 14px;
    }
    #config label { display: flex; align-items: center; gap: 6px; cursor: pointer; }
    #config input[type="text"], #config input[type="number"] {
      background: #111318; border: 1px solid #2a2e37; border-radius: 5px;
      color: #d6d6d6; font: inherit; padding: 3px 7px;
    }
    #config input[type="text"] { width: 100%; }
    #config input[type="number"] { width: 62px; }
    #config .row { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
    #config .hint { color: #6a6f78; font-size: 11px; margin-top: 3px; }

    #wall { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-start; }
    .empty { color: #8a8f98; font-style: italic; padding: 24px 8px; }

    /* A cluster: grouped characters share an enclosing frame. */
    .cluster { display: flex; flex-direction: column; gap: 6px; border-radius: 12px; }
    .cluster.grouped { border: 1px solid #3a3f4a; background: #14161c; padding: 8px; }
    .cluster-head { display: flex; gap: 10px; font-size: 11px; padding: 0 2px; }
    .cluster-head .leader { color: #00bfff; font-weight: bold; }
    .cluster-head .unconfirmed { color: #ffb000; font-style: italic; }
    .cluster-cards { display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-start; }

    .card {
      width: 240px;
      background: #1a1d24; border: 1px solid #2a2e37; border-radius: 10px;
      padding: 8px 10px 10px;
      display: flex; flex-direction: column; gap: 5px;
      transition: opacity .3s;
    }
    .card.stale { opacity: .45; }
    .card-head { display: flex; align-items: baseline; gap: 6px; }
    .card-head .name { font-weight: bold; font-size: 15px; }
    .card-head .room { margin-left: auto; font-size: 11px; color: #8a8f98; cursor: default; }
    .card-head .off { color: #ffb000; font-size: 11px; }

    .rt { font-size: 12px; min-height: 15px; display: flex; gap: 10px; }
    .rt .hard { color: #ff6600; font-weight: bold; }
    .rt .cast { color: #6699ff; font-weight: bold; }

    .chips { display: flex; flex-wrap: wrap; gap: 3px; min-height: 16px; }
    .chip {
      font-size: 10px; padding: 1px 5px; border-radius: 4px;
      background: #262a33; font-weight: bold;
    }

    .body { display: flex; gap: 8px; }
    .doll { flex: 0 0 90px; align-self: flex-start; }
    .doll svg { width: 100%; height: auto; display: block; }
    .stack { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }

    .bar {
      position: relative; height: 15px; border-radius: 4px;
      background: #262a33; overflow: hidden;
    }
    .bar .fill { position: absolute; inset: 0 auto 0 0; border-radius: 4px; }
    .bar .txt {
      position: absolute; inset: 0; display: flex; align-items: center;
      padding-left: 5px; font-size: 10.5px; color: #fff;
      text-shadow: 0 0 3px #000, 0 0 3px #000;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    .hands { font-size: 11px; color: #b8b8b8; line-height: 1.35; }
    .hands .slot { color: #8a8f98; }
    .hands div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .prep { color: #cf9fff; }

    .effects { display: flex; flex-direction: column; gap: 2px; }
    .fx { font-size: 11px; display: flex; gap: 6px; }
    .fx .n { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .fx .t { margin-left: auto; color: #8a8f98; flex: none; }
    .fx.debuff { color: #ff9090; }
    .fx.cooldown { color: #9fc5ff; }
    .fx.buff { color: #9fdfb0; }
    .fx.spell { color: #cdb8ef; }
  </style>
</head>
<body>
  <header>
    <h1>Characters</h1>
    <a id="back" href="/">&larr; sessions</a>
    <button id="gear" type="button">&#9881; display</button>
  </header>
  <div id="config"></div>
  <div id="wall"><div class="empty">Looking for sessions&hellip;</div></div>

  <script>
    "use strict";
    // ---- constants mirrored from the native client -------------------
    const LEVEL_COLORS = {
      1: "#aa5500", 2: "#ff8800", 3: "#ff0000",
      4: "#999999", 5: "#777777", 6: "#555555",
    };
    // Viewer-mirrored like the game's doll (same geometry as /play).
    const DOLL_PARTS = [
      ["head", "<circle cx='70' cy='16' r='13'/>"],
      ["rightEye", "<circle cx='64' cy='13' r='3'/>"],
      ["leftEye", "<circle cx='76' cy='13' r='3'/>"],
      ["neck", "<rect x='63' y='29' width='14' height='7' rx='2'/>"],
      ["chest", "<rect x='50' y='36' width='40' height='26' rx='3'/>"],
      ["abdomen", "<rect x='52' y='62' width='36' height='20' rx='3'/>"],
      ["rightArm", "<rect x='33' y='38' width='14' height='42' rx='6'/>"],
      ["leftArm", "<rect x='93' y='38' width='14' height='42' rx='6'/>"],
      ["rightHand", "<rect x='33' y='82' width='14' height='12' rx='4'/>"],
      ["leftHand", "<rect x='93' y='82' width='14' height='12' rx='4'/>"],
      ["rightLeg", "<rect x='52' y='84' width='16' height='46' rx='6'/>"],
      ["leftLeg", "<rect x='72' y='84' width='16' height='46' rx='6'/>"],
    ];
    // Same set + colors as the GUI card's status row.
    const STATUS_CHIPS = [
      ["dead", "DEAD", "#ff4444"],
      ["stunned", "STUN", "#ffd700"],
      ["bleeding", "BLEED", "#dc143c"],
      ["webbed", "WEB", "#c0c0c0"],
      ["prone", "PRONE", "#ffa500"],
      ["kneeling", "KNEEL", "#ffa500"],
      ["sitting", "SIT", "#ffa500"],
      ["hidden", "HIDE", "#9a9a9a"],
      ["invisible", "INVIS", "#add8e6"],
      ["poisoned", "POIS", "#32cd32"],
      ["diseased", "DIS", "#8b4513"],
      ["joined", "J", "#00bfff"],
    ];
    const IGNORED_INDICATORS = new Set(["standing"]);
    const VITAL_BARS = [
      ["health", "HP", "#cd4d4d"],
      ["mana", "MP", "#4784d9"],
      ["stamina", "ST", "#55b86c"],
      ["spirit", "SP", "#cba942"],
    ];
    // Gauge fills match the GUI card.
    const GAUGE_BARS = [
      ["mind", "Mind", "#7ccd7c"],
      ["stance", "Stance", "#5cacee"],
      ["encumbrance", "Enc", "#c4a000"],
    ];
    const EFFECT_STYLES = {
      Debuffs: "debuff", Cooldowns: "cooldown", Buffs: "buff", ActiveSpells: "spell",
    };
    // Matches the hub: a disconnected card lingers dimmed, then drops.
    const DROP_AFTER_MS = 120000;

    // ---- display config (persisted per browser) -------------------------
    const CONFIG_KEY = "vellum-characters-config";
    const CONFIG_FIELDS = [
      // [key, label] — everything on by default; the panel narrows it.
      ["room", "Room id"],
      ["rt", "Roundtime"],
      ["status", "Status icons"],
      ["doll", "Injury doll"],
      ["vitals", "Vitals"],
      ["absolute", "Vitals as numbers"],
      ["mind", "Mind state"],
      ["stance", "Stance"],
      ["encumbrance", "Encumbrance"],
      ["fieldExp", "Field experience"],
      ["hands", "Hands / casting"],
      ["effects", "Effects"],
    ];
    const EFFECT_CATEGORY_FIELDS = [
      ["Debuffs", "Debuffs"],
      ["Cooldowns", "Cooldowns"],
      ["Buffs", "Buffs"],
      ["ActiveSpells", "Active spells"],
    ];
    function defaultConfig() {
      const c = { filter: "", maxEffects: 4, categories: { Debuffs: true, Cooldowns: true, Buffs: false, ActiveSpells: false } };
      for (const [key] of CONFIG_FIELDS) c[key] = true;
      return c;
    }
    let config = defaultConfig();
    try {
      const saved = JSON.parse(localStorage.getItem(CONFIG_KEY) || "{}");
      config = { ...config, ...saved, categories: { ...config.categories, ...(saved.categories || {}) } };
    } catch { /* defaults */ }
    function saveConfig() {
      try { localStorage.setItem(CONFIG_KEY, JSON.stringify(config)); } catch { /* private mode */ }
      scheduleRender();
    }

    function buildConfigPanel() {
      const panel = document.getElementById("config");
      panel.replaceChildren();
      const h = (t) => { const e = el("h2", null, t); panel.appendChild(e); return e; };
      h("Card contents");
      const grid = el("div", "grid");
      for (const [key, label] of CONFIG_FIELDS) {
        const lab = el("label");
        const box = document.createElement("input");
        box.type = "checkbox";
        box.checked = !!config[key];
        box.onchange = () => { config[key] = box.checked; saveConfig(); };
        lab.append(box, document.createTextNode(label));
        grid.appendChild(lab);
      }
      panel.appendChild(grid);
      h("Effect categories");
      const cats = el("div", "grid");
      for (const [key, label] of EFFECT_CATEGORY_FIELDS) {
        const lab = el("label");
        const box = document.createElement("input");
        box.type = "checkbox";
        box.checked = !!config.categories[key];
        box.onchange = () => { config.categories[key] = box.checked; saveConfig(); };
        lab.append(box, document.createTextNode(label));
        cats.appendChild(lab);
      }
      panel.appendChild(cats);
      const filterRow = el("div", "row");
      filterRow.appendChild(el("span", null, "Only show effects matching:"));
      panel.appendChild(filterRow);
      const filter = document.createElement("input");
      filter.type = "text";
      filter.placeholder = "comma-separated, empty = all";
      filter.value = config.filter;
      filter.oninput = () => { config.filter = filter.value; saveConfig(); };
      panel.appendChild(filter);
      const maxRow = el("div", "row");
      const max = document.createElement("input");
      max.type = "number"; max.min = "1"; max.max = "20";
      max.value = String(config.maxEffects);
      max.onchange = () => {
        config.maxEffects = Math.max(1, Math.min(20, Number(max.value) || 4));
        saveConfig();
      };
      maxRow.append(max, el("span", null, "max effects per card"));
      panel.appendChild(maxRow);
      panel.appendChild(el("div", "hint", "Saved in this browser."));
    }
    document.getElementById("gear").onclick = () => {
      const panel = document.getElementById("config");
      panel.classList.toggle("open");
      document.getElementById("gear").classList.toggle("open", panel.classList.contains("open"));
    };

    // ---- state --------------------------------------------------------
    // port -> peer. Mirrors core/multiaccount PeerStatus.
    const peers = new Map();
    // port -> WebSocket, so a session list refresh does not double-connect.
    const sockets = new Map();

    function pairingToken() {
      const m = location.hash.match(/token=([^&]+)/);
      return m ? decodeURIComponent(m[1]) : "";
    }
    document.getElementById("back").href = "/" + location.hash;

    function newPeer(port, name) {
      return {
        port, character: name || "", connected: false, lastUpdate: 0,
        vitals: null, minivitals: {}, indicators: {}, injuries: {},
        group: { leader: { kind: "none" }, members: [], confirmed: true },
        rt: null, serverOffset: 0,
        gauges: {}, fieldExp: null,
        left: null, right: null, prepared: null,
        effects: {}, roomName: null, roomId: null,
        // This character's OWN doll skin, fetched from their session.
        dollSkin: undefined, dollNatural: {}, dollVariant: null,
        dollHidden: new Set(),
      };
    }

    // ---- per-peer doll skin (each session serves its own art) -----------
    function dollImageUrl(peer, kind, part, level, variant) {
      let url = `http://${location.hostname}:${peer.port}/doll/image` +
        `?kind=${kind}&token=${encodeURIComponent(pairingToken())}`;
      if (part) url += `&part=${encodeURIComponent(part)}&level=${level}`;
      if (variant) url += `&variant=${encodeURIComponent(variant)}`;
      return url;
    }
    function fetchDollSkin(peer) {
      if (peer.dollSkin !== undefined) return; // fetched (or in flight)
      peer.dollSkin = null;
      fetch(`http://${location.hostname}:${peer.port}/doll.json?token=${encodeURIComponent(pairingToken())}`)
        .then((r) => (r.ok ? r.json() : null))
        .then((d) => {
          peer.dollSkin = d && d.base ? d : null;
          if (peer.dollSkin) measureDollBase(peer, "");
        })
        .catch(() => { peer.dollSkin = null; });
    }
    function activeDollSet(peer) {
      if (peer.dollVariant && peer.dollSkin && peer.dollSkin.variants &&
          peer.dollSkin.variants[peer.dollVariant]) {
        return { key: peer.dollVariant, set: peer.dollSkin.variants[peer.dollVariant] };
      }
      return { key: "", set: peer.dollSkin };
    }
    function measureDollBase(peer, key) {
      if (!peer.dollSkin || peer.dollNatural[key]) return;
      const img = new Image();
      img.onload = () => {
        peer.dollNatural[key] = { w: img.naturalWidth, h: img.naturalHeight };
        scheduleRender();
      };
      img.onerror = () => { if (key === "") peer.dollSkin = null; };
      img.src = dollImageUrl(peer, "base", null, 0, key || null);
    }
    function safeColor(value, fallback) {
      return /^#[0-9a-f]{6}$/i.test(value || "") ? value : fallback;
    }
    function dotNumeralColor(hex) {
      const r = parseInt(hex.slice(1, 3), 16);
      const g = parseInt(hex.slice(3, 5), 16);
      const b = parseInt(hex.slice(5, 7), 16);
      return 0.299 * r + 0.587 * g + 0.114 * b > 140 ? "#000000" : "#ffffff";
    }
    // Port of /play's skinDollSvg, parameterized by peer: their base art,
    // their overlays, their wounds. Anchors are fractions of the base, so
    // the SVG scales to the card column.
    function skinDollSvg(peer) {
      const { key: setKey, set } = activeDollSet(peer);
      const natural = peer.dollNatural[setKey];
      if (!natural) { measureDollBase(peer, setKey); return null; }
      const variant = setKey || null;
      const { w, h } = natural;
      const injuries = peer.injuries || {};
      const dots = set.dots || {};
      const woundColor = safeColor(dots.wound_color, "#e02020");
      const scarColor = safeColor(dots.scar_color, "#b8b8b8");
      const opacity = typeof dots.opacity === "number" ? Math.min(Math.max(dots.opacity, 0), 1) : 0.9;
      const r = Math.max(((dots.diameter || 0.07) * h) / 2, 3);
      const fontSize = Math.max(r * 1.3, 8);
      const parts = [`<image href="${dollImageUrl(peer, "base", null, 0, variant)}" width="${w}" height="${h}"/>`];
      const overlays = set.overlays || {};
      const healthySet = new Set(set.healthy || []);
      for (const id of Object.keys(set.anchors || {}).sort()) {
        const level = Number(injuries[id]) || 0;
        if (level > 6) continue;
        if (peer.dollHidden.has(id)) continue;
        const handDrawn = healthySet.has(id) || (overlays[id] || []).length > 0;
        if (handDrawn) {
          if (level === 0 && healthySet.has(id)) {
            parts.push(`<image href="${dollImageUrl(peer, "overlay", id, 0, variant)}" width="${w}" height="${h}"/>`);
          } else if (level >= 1 && (overlays[id] || []).includes(level)) {
            parts.push(`<image href="${dollImageUrl(peer, "overlay", id, level, variant)}" width="${w}" height="${h}"/>`);
          }
          continue; // a state with no art: the base shows through
        }
        if (!level) continue;
        const anchor = (set.anchors || {})[id];
        if (!anchor) continue;
        const cx = anchor[0] * w;
        const cy = anchor[1] * h;
        const numeral = level <= 3 ? level : level - 3;
        const text = (fill) =>
          `<text x="${cx}" y="${cy}" fill="${fill}" font-size="${fontSize}" ` +
          `font-weight="700" text-anchor="middle" dominant-baseline="central">${numeral}</text>`;
        if (level <= 3) {
          parts.push(
            `<g opacity="${opacity}"><circle cx="${cx}" cy="${cy}" r="${r}" fill="${woundColor}"/>` +
            text(dotNumeralColor(woundColor)) + `</g>`);
        } else {
          const strokeWidth = Math.max(r * 0.28, 1.2);
          parts.push(
            `<g opacity="${opacity}"><circle cx="${cx}" cy="${cy}" r="${r}" fill="none" ` +
            `stroke="${scarColor}" stroke-width="${strokeWidth}"/>` + text(scarColor) + `</g>`);
        }
      }
      return `<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="Injury doll">${parts.join("")}</svg>`;
    }
    function vectorDollSvg(injuries) {
      const parts = DOLL_PARTS.map(([part, shape]) => {
        const level = injuries[part] || 0;
        const color = LEVEL_COLORS[level] || "#3a4150";
        return shape.replace("/>", ` fill='${color}' stroke='#20242c' stroke-width='1'/>`);
      }).join("");
      // back/nsys have no geometry; dots under the figure, like /play.
      let dots = "";
      let x = 40;
      for (const extra of ["back", "nsys"]) {
        const level = injuries[extra] || 0;
        if (level) {
          dots += `<circle cx='${x}' cy='138' r='5' fill='${LEVEL_COLORS[level]}'/>` +
            `<text x='${x + 9}' y='142' font-size='10' fill='#8a8f98'>${extra}</text>`;
          x += 46;
        }
      }
      return `<svg viewBox='0 0 140 148' xmlns='http://www.w3.org/2000/svg'>${parts}${dots}</svg>`;
    }

    // ---- frame application (mirrors hub.rs apply_frame) ----------------
    function applyFrame(peer, msg) {
      const d = msg.d || {};
      switch (msg.t) {
        case "snapshot": {
          if (d.character) peer.character = d.character;
          if (d.vitals) peer.vitals = d.vitals;
          if (d.indicators) peer.indicators = d.indicators;
          if (d.injuries) peer.injuries = d.injuries;
          if (d.rt) applyRt(peer, d.rt);
          if (d.room) applyRoom(peer, d.room);
          if (d.effects) applyEffects(peer, d.effects);
          if (d.hands) applyHands(peer, d.hands);
          // A snapshot is authoritative: fields the encoder skips when
          // empty are ABSENT precisely when the peer has none.
          peer.group = d.group || { leader: { kind: "none" }, members: [], confirmed: true };
          applyMinivitals(peer, d.minivitals || []);
          if (d.char_info && d.char_info.gauges) {
            applyGauges(peer, d.char_info.gauges);
          } else {
            peer.gauges = {}; peer.fieldExp = null;
          }
          peer.prepared = d.prepared_spell || null;
          peer.dollVariant = d.doll_variant || null;
          peer.dollHidden = new Set(d.doll_hidden || []);
          break;
        }
        case "vitals": peer.vitals = d; break;
        case "indicators": peer.indicators = d; break;
        case "injuries": peer.injuries = d; break;
        case "group": peer.group = d; break;
        case "rt": applyRt(peer, d); break;
        case "charinfo": if (d.gauges) applyGauges(peer, d.gauges); break;
        case "room": applyRoom(peer, d); break;
        case "effects": applyEffects(peer, d); break;
        case "hands": applyHands(peer, d); break;
        case "minivitals": applyMinivitals(peer, d); break;
        case "prepared_spell": peer.prepared = d.spell || null; break;
        case "doll":
          peer.dollVariant = (d && d.variant) || null;
          peer.dollHidden = new Set((d && d.hidden) || []);
          break;
        default: return;
      }
      peer.lastUpdate = Date.now();
      peer.connected = true;
      scheduleRender();
    }
    function applyRt(peer, d) {
      peer.rt = { roundtime_end: d.roundtime_end ?? null, casttime_end: d.casttime_end ?? null };
      if (typeof d.server_time === "number") {
        // Peer clocks differ from ours; interpolate on the wall clock.
        peer.serverOffset = d.server_time - Math.floor(Date.now() / 1000);
      }
    }
    function applyRoom(peer, d) {
      peer.roomName = d.name || null;
      peer.roomId = d.id || null;
    }
    function applyHands(peer, d) {
      // Absent means empty-handed, not unchanged (both slots ship each time).
      peer.left = d.left || null;
      peer.right = d.right || null;
    }
    function applyMinivitals(peer, list) {
      peer.minivitals = {};
      for (const v of Array.isArray(list) ? list : []) {
        peer.minivitals[v.id] = [v.value, v.max];
      }
    }
    function applyGauges(peer, g) {
      // Absent sections mean "unchanged", matching the hub.
      for (const k of ["mind", "encumbrance", "stance"]) {
        if (g[k]) peer.gauges[k] = g[k];
      }
      if (g.field_exp) peer.fieldExp = [g.field_exp.value, g.field_exp.max];
    }
    function applyEffects(peer, list) {
      peer.effects = {};
      for (const c of Array.isArray(list) ? list : []) {
        peer.effects[c.category] = c;
      }
    }

    // ---- clustering (mirrors core/multiaccount cluster_peers) ----------
    function isGrouped(g) {
      return (g.leader && g.leader.kind !== "none") || (g.members || []).length > 0;
    }
    function clusterPeers() {
      const ports = [...peers.keys()].sort((a, b) => a - b);
      const byName = new Map();
      for (const p of ports) {
        byName.set((peers.get(p).character || "").toLowerCase(), p);
      }
      const parent = new Map(ports.map((p) => [p, p]));
      const find = (x) => {
        while (parent.get(x) !== x) x = parent.get(x);
        return x;
      };
      const union = (a, b) => {
        const [ra, rb] = [find(a), find(b)];
        if (ra !== rb) parent.set(Math.max(ra, rb), Math.min(ra, rb));
      };
      // Link peers that name each other (members + a followed leader).
      for (const p of ports) {
        const g = peers.get(p).group;
        if (!isGrouped(g)) continue;
        const everyone = [...(g.members || [])];
        if (g.leader && g.leader.kind === "other" && g.leader.who) everyone.push(g.leader.who);
        for (const m of everyone) {
          const other = byName.get((m.name || "").toLowerCase());
          if (other !== undefined && other !== p) union(p, other);
        }
      }
      // Shared foreign leader.
      const byForeign = new Map();
      for (const p of ports) {
        const g = peers.get(p).group;
        if (g.leader && g.leader.kind === "other" && g.leader.who) {
          const key = (g.leader.who.name || "").toLowerCase();
          if (!byName.has(key)) {
            if (!byForeign.has(key)) byForeign.set(key, []);
            byForeign.get(key).push(p);
          }
        }
      }
      for (const list of byForeign.values()) {
        for (let i = 1; i < list.length; i++) union(list[0], list[i]);
      }
      // Grouped-per-the-game with no roster: cluster together, unconfirmed.
      const joinedUnknown = ports.filter((p) => {
        const g = peers.get(p).group;
        return g.leader && g.leader.kind === "unknown" && !(g.members || []).length;
      });
      for (let i = 1; i < joinedUnknown.length; i++) union(joinedUnknown[0], joinedUnknown[i]);

      const groups = new Map();
      for (const p of ports) {
        const r = find(p);
        if (!groups.has(r)) groups.set(r, []);
        groups.get(r).push(p);
      }
      return [...groups.values()].map((members) => {
        members.sort((a, b) => a - b);
        if (members.length === 1) {
          const g = peers.get(members[0]).group;
          if (g.leader && g.leader.kind === "other" && g.leader.who) {
            return { members, leaderName: g.leader.who.name, confirmed: !!g.confirmed, grouped: true };
          }
          if (g.leader && g.leader.kind === "unknown") {
            return { members, leaderName: null, confirmed: false, grouped: true };
          }
          return { members, leaderName: null, confirmed: true, grouped: false };
        }
        const leaderPort = members.find(
          (p) => peers.get(p).group.leader && peers.get(p).group.leader.kind === "self_led"
        );
        let leaderName = leaderPort !== undefined ? peers.get(leaderPort).character : null;
        if (!leaderName) {
          for (const p of members) {
            const l = peers.get(p).group.leader;
            if (l && l.kind === "other" && l.who) { leaderName = l.who.name; break; }
          }
        }
        if (leaderPort !== undefined) {
          members.splice(members.indexOf(leaderPort), 1);
          members.unshift(leaderPort);
        }
        const confirmed = members.every((p) => peers.get(p).group.confirmed);
        return { members, leaderName, confirmed, grouped: true };
      });
    }

    // ---- rendering ------------------------------------------------------
    let renderQueued = false;
    function scheduleRender() {
      if (renderQueued) return;
      renderQueued = true;
      requestAnimationFrame(() => { renderQueued = false; render(); });
    }

    function el(tag, cls, text) {
      const e = document.createElement(tag);
      if (cls) e.className = cls;
      if (text !== undefined) e.textContent = text;
      return e;
    }
    function fmtDuration(s) {
      if (s < 60) return `${s}s`;
      if (s < 3600) return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
      return `${Math.floor(s / 3600)}h${String(Math.floor((s % 3600) / 60)).padStart(2, "0")}`;
    }
    // A one-line bar with a fill and an overlaid, ellipsized label — vitals
    // and gauges alike, so nothing wraps to a second line.
    function barEl(text, pct, color) {
      const bar = el("div", "bar");
      const fill = el("div", "fill");
      fill.style.width = `${Math.max(0, Math.min(100, pct))}%`;
      fill.style.background = color;
      bar.appendChild(fill);
      const txt = el("div", "txt", text);
      txt.title = text;
      bar.appendChild(txt);
      return bar;
    }

    function render() {
      const wall = document.getElementById("wall");
      const now = Date.now();
      // Reap: disconnected long enough to be gone (mirrors the hub).
      for (const [port, peer] of [...peers]) {
        if (!peer.connected && now - peer.lastUpdate > DROP_AFTER_MS) {
          peers.delete(port);
        }
      }
      wall.replaceChildren();
      if (!peers.size) {
        wall.appendChild(el("div", "empty", "No sessions running"));
        return;
      }
      for (const cluster of clusterPeers()) {
        const box = el("div", cluster.grouped ? "cluster grouped" : "cluster");
        if (cluster.grouped && (cluster.leaderName || !cluster.confirmed)) {
          const head = el("div", "cluster-head");
          if (cluster.leaderName) {
            head.appendChild(el("span", "leader", `⚑ ${cluster.leaderName}`));
          }
          if (!cluster.confirmed) {
            head.appendChild(el("span", "unconfirmed", "roster unconfirmed"));
          }
          box.appendChild(head);
        }
        const row = el("div", "cluster-cards");
        for (const port of cluster.members) {
          row.appendChild(renderCard(peers.get(port), now));
        }
        box.appendChild(row);
        wall.appendChild(box);
      }
    }

    function renderCard(peer, now) {
      const card = el("div", "card");
      if (!peer.connected) card.classList.add("stale");

      const head = el("div", "card-head");
      head.appendChild(el("span", "name", peer.character || "(unnamed)"));
      if (!peer.connected) head.appendChild(el("span", "off", "●"));
      if (config.room) {
        const room = el("span", "room", peer.roomId || "");
        if (peer.roomName) room.title = peer.roomName;
        head.appendChild(room);
      }
      card.appendChild(head);

      // RT/CT, interpolated on our wall clock against the peer's offset.
      const nowServer = Math.floor(now / 1000) + peer.serverOffset;
      if (config.rt) {
        const rtRow = el("div", "rt");
        const rt = peer.rt ? Math.max(0, (peer.rt.roundtime_end || 0) - nowServer) : 0;
        const ct = peer.rt ? Math.max(0, (peer.rt.casttime_end || 0) - nowServer) : 0;
        if (rt > 0) rtRow.appendChild(el("span", "hard", `RT ${rt}`));
        if (ct > 0) rtRow.appendChild(el("span", "cast", `CT ${ct}`));
        card.appendChild(rtRow);
      }

      if (config.status) {
        const chips = el("div", "chips");
        for (const [id, label, color] of STATUS_CHIPS) {
          if (peer.indicators[id]) {
            const chip = el("span", "chip", label);
            chip.style.color = color;
            chips.appendChild(chip);
          }
        }
        for (const [id, active] of Object.entries(peer.indicators)) {
          if (active && !IGNORED_INDICATORS.has(id) && !STATUS_CHIPS.some(([k]) => k === id)) {
            chips.appendChild(el("span", "chip", id.toUpperCase()));
          }
        }
        card.appendChild(chips);
      }

      // Doll + vitals/gauges side by side, like the GUI two-column layout.
      const body = el("div", "body");
      if (config.doll) {
        const doll = el("div", "doll");
        // This character's own skin when their session ships doll art;
        // the shared vector figure otherwise.
        const svg = peer.dollSkin ? skinDollSvg(peer) : null;
        doll.innerHTML = svg || vectorDollSvg(peer.injuries || {});
        body.appendChild(doll);
      }
      const stack = el("div", "stack");
      if (config.vitals) {
        for (const [id, label, color] of VITAL_BARS) {
          const pct = peer.vitals ? peer.vitals[id] ?? 0 : 0;
          const abs = peer.minivitals[id];
          const text = config.absolute && abs && abs[1] > 0
            ? `${label} ${abs[0]}/${abs[1]}` : `${label} ${pct}%`;
          stack.appendChild(barEl(text, pct, color));
        }
      }
      for (const [key, label, color] of GAUGE_BARS) {
        if (!config[key === "encumbrance" ? "encumbrance" : key]) continue;
        const g = peer.gauges[key];
        if (!g) continue;
        const text = g.text ? `${label} ${g.text}` : `${label} ${g.value}%`;
        stack.appendChild(barEl(text, g.value ?? 0, color));
      }
      if (config.fieldExp && peer.fieldExp) {
        const [cur, max] = peer.fieldExp;
        const pct = max > 0 ? Math.round((cur / max) * 100) : 0;
        // Near the cap is the warning state: the point of watching FXP is
        // knowing when to go absorb.
        const color = pct >= 90 ? "#e05050" : "#b08de0";
        stack.appendChild(barEl(`FXP ${cur}/${max}`, pct, color));
      }
      if (stack.childNodes.length) body.appendChild(stack);
      if (body.childNodes.length) card.appendChild(body);

      // Hands + prepared spell.
      if (config.hands) {
        const hands = el("div", "hands");
        const hand = (slot, item) => {
          const line = el("div");
          line.appendChild(el("span", "slot", `${slot} `));
          line.appendChild(el("span", null, item || "—"));
          if (item) line.title = item;
          return line;
        };
        if (peer.left || peer.right) {
          hands.appendChild(hand("L", peer.left));
          hands.appendChild(hand("R", peer.right));
        }
        if (peer.prepared) hands.appendChild(el("div", "prep", `✦ ${peer.prepared}`));
        if (hands.childNodes.length) card.appendChild(hands);
      }

      // Effects: chosen categories, filtered, expiring-first cap.
      if (config.effects) {
        const filters = config.filter
          .split(",").map((s) => s.trim().toLowerCase()).filter(Boolean);
        const fx = el("div", "effects");
        let shown = 0;
        for (const [category, style] of Object.entries(EFFECT_STYLES)) {
          if (!config.categories[category]) continue;
          const content = peer.effects[category];
          if (!content) continue;
          for (const effect of content.effects || []) {
            if (shown >= config.maxEffects) break;
            const name = effect.text || effect.id || "";
            if (filters.length && !filters.some((f) => name.toLowerCase().includes(f))) continue;
            const line = el("div", `fx ${style}`);
            const n = el("span", "n", name);
            n.title = name;
            line.appendChild(n);
            if (effect.expires_at) {
              const left = effect.expires_at - nowServer;
              if (left <= 0) continue;
              line.appendChild(el("span", "t", fmtDuration(left)));
            }
            fx.appendChild(line);
            shown++;
          }
        }
        if (fx.childNodes.length) card.appendChild(fx);
      }

      return card;
    }

    // ---- connections (mirrors hub.rs run_peer) --------------------------
    function connect(session) {
      const port = session.port;
      if (sockets.has(port)) return;
      const ws = new WebSocket(`ws://${location.hostname}:${port}/ws`);
      sockets.set(port, ws);
      ws.onopen = () => {
        // Auth first, declare watch BEFORE resume so the snapshot comes
        // back already trimmed, then resume 0 to request it.
        ws.send(JSON.stringify({ t: "auth", d: { token: pairingToken() } }));
        ws.send(JSON.stringify({ t: "subscribe", d: { mode: "watch" } }));
        ws.send(JSON.stringify({ t: "resume", d: { seq: 0 } }));
        if (!peers.has(port)) peers.set(port, newPeer(port, session.character));
        const peer = peers.get(port);
        peer.connected = true;
        peer.lastUpdate = Date.now();
        fetchDollSkin(peer);
        scheduleRender();
      };
      ws.onmessage = (event) => {
        let msg;
        try { msg = JSON.parse(event.data); } catch { return; }
        // Re-materialize if the reaper dropped the card mid-connection.
        if (!peers.has(port)) peers.set(port, newPeer(port, session.character));
        applyFrame(peers.get(port), msg);
      };
      ws.onclose = () => {
        sockets.delete(port);
        const peer = peers.get(port);
        if (peer) {
          peer.connected = false;
          peer.lastUpdate = Date.now();
          scheduleRender();
        }
        // The session poll re-dials live ports; no per-socket retry loop.
      };
      ws.onerror = () => ws.close();
    }

    async function refreshSessions() {
      let sessions = [];
      try {
        const token = encodeURIComponent(pairingToken());
        sessions = await (await fetch(`/sessions?token=${token}`)).json();
        if (!Array.isArray(sessions)) sessions = [];
      } catch { /* keep whatever is connected */ }
      for (const s of sessions) connect(s);
      scheduleRender();
    }

    buildConfigPanel();
    refreshSessions();
    setInterval(refreshSessions, 10000);
    // RT/effect countdowns tick on the wall clock.
    setInterval(scheduleRender, 1000);
  </script>
</body>
</html>
